<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="根据工作区 Word 模板，在浏览器本地生成诉讼、仲裁和执行委托手续文件">
  <title>委托手续</title>
  <style>
    :root{
      color-scheme:light;
      --ink:#242b35;
      --muted:#6b7280;
      --line:#e5e7eb;
      --brand:#315b75;
      --brand-dark:#24475e;
      --soft:#f7f8fa;
      --panel:#ffffff;
      --good:#067647;
      --bad:#b42318;
      --warn:#9a6700;
      --shadow:none;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      background:var(--soft);
      color:var(--ink);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    }
    main{max-width:1040px;margin:0 auto;padding:32px 24px 64px}
    header{display:flex;justify-content:space-between;gap:24px;align-items:center;margin-bottom:24px}
    h1{font-size:25px;line-height:1.4;letter-spacing:.02em;margin:0;font-weight:600}
    header p{margin:0;color:var(--muted);line-height:1.65;max-width:760px}
    .badge{white-space:nowrap;color:var(--muted);font-size:12px;font-weight:400}
    form{display:grid;gap:16px}
    section{
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:12px;
      padding:24px;
      box-shadow:var(--shadow);
    }
    section h2{font-size:16px;font-weight:600;margin:0 0 20px}
    section > .section-note{margin:0 0 17px;color:var(--muted);font-size:13px;line-height:1.55}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px 18px}
    .grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
    .wide{grid-column:1/-1}
    label{display:grid;gap:8px;font-size:13px;font-weight:500;align-content:start;position:relative}
    label .optional{color:var(--muted);font-weight:400;font-size:11px;position:absolute;top:1px;right:0}
    input,select,textarea{
      width:100%;
      border:1px solid #d9dde3;
      border-radius:7px;
      padding:10px 11px;
      background:#fff;
      color:var(--ink);
      font:400 14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
      line-height:1.35;
    }
    textarea{min-height:76px;resize:vertical}
    input:focus,select:focus,textarea:focus{outline:3px solid rgba(49,91,117,.12);border-color:var(--brand)}
    input[readonly]{background:#f7f9fc;color:#46546b}
    .hint{color:var(--muted);font-size:12px;font-weight:400;line-height:1.45}
    .hidden{display:none!important}
    .check-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
    .check{
      display:flex;
      align-items:center;
      gap:9px;
      border:1px solid var(--line);
      border-radius:8px;
      padding:11px 12px;
      background:#fff;
      font-size:14px;
      font-weight:500;
      cursor:pointer;
    }
    .check input{width:17px;height:17px;margin:0;accent-color:var(--brand)}
    .check:has(input:checked){background:#f1f6f8;border-color:#b2c6d1}
    button:focus-visible{outline:3px solid #a7c2d3;outline-offset:3px}
    .subpanel{border:1px solid #e3e8f1;background:#f9fbff;border-radius:12px;padding:14px}
    .subpanel h3{font-size:14px;margin:0 0 10px}
    .actions{
      display:flex;
      flex-wrap:wrap;
      align-items:center;
      gap:12px;
      position:sticky;
      bottom:14px;
      z-index:3;
      padding:14px 16px;
      background:rgba(255,255,255,.94);
      border:1px solid var(--line);
      border-radius:10px;
      box-shadow:0 4px 20px rgba(20,35,70,.08);
      backdrop-filter:blur(12px);
    }
    button{
      border:0;
      border-radius:7px;
      padding:11px 18px;
      background:var(--brand);
      color:#fff;
      font-family:inherit;font-size:14px;font-weight:500;
      cursor:pointer;
      transition:background .15s ease,transform .15s ease;
    }
    button:hover{background:var(--brand-dark)}
    button:disabled{opacity:.55;cursor:wait;transform:none}
    button.secondary{background:#fff;color:var(--brand);border:1px solid #ccd7de}
    button.secondary:hover{background:#f1f6f8}
    #status{font-size:14px;line-height:1.5;color:var(--muted)}
    #status.good{color:var(--good)}
    #status.bad{color:var(--bad)}
    #status.warn{color:var(--warn)}
    .results{display:grid;gap:10px;margin-top:16px}
    .result-card{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      border:1px solid #dbe4f5;
      background:#f8fbff;
      border-radius:11px;
      padding:12px 14px;
    }
    .result-card .name{font-weight:700;font-size:14px;word-break:break-all}
    .result-card .meta{font-size:12px;color:var(--muted);margin-top:3px}
    .result-card button{padding:8px 13px;font-size:13px;white-space:nowrap}
    .empty{color:var(--muted);font-size:13px;padding:10px 0}
    .template-note{display:flex;gap:10px;align-items:flex-start;background:#f5f8ff;border-left:3px solid var(--brand);padding:11px 13px;border-radius:8px;color:#42516a;font-size:12px;line-height:1.6}
    .template-note strong{color:var(--ink)}
    .party-list{display:grid;gap:14px}
    .party-card{border:1px solid var(--line);background:#fafbfc;border-radius:9px;padding:18px}
    .party-card.is-client{border-color:#b2c6d1;background:#fcfdfe;box-shadow:none}
    .party-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:13px}
    .party-head strong{font-size:15px}
    .party-head-actions{display:flex;align-items:center;gap:10px}
    .party-head-actions .check{padding:7px 10px;background:#fff}
    .party-remove{padding:7px 11px;font-size:12px;background:transparent;color:var(--muted);border:1px solid transparent}
    .party-remove:hover{background:#fff3f1}
    .party-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px 15px}
    .party-summary{margin-top:12px;color:var(--muted);font-size:13px;line-height:1.55}
    .party-summary strong{color:var(--ink)}
    .inline-actions{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap}
    .inline-actions button{padding:9px 14px;font-size:13px}
    .field-note{font-size:12px;color:var(--muted);font-weight:400;line-height:1.45}
    #resultsSection{margin-top:20px}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}button{transition:none}}
    @media(max-width:820px){
      header{display:block}
      .badge{display:inline-block;margin-top:14px}
      .check-grid,.grid.three,.party-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
    }
    @media(max-width:620px){
      main{padding:24px 13px 58px}
      section{padding:17px}
      .grid,.grid.three,.check-grid,.party-grid{grid-template-columns:1fr}
      .wide{grid-column:auto}
      .actions{bottom:8px}
      h1{font-size:25px}
    }
  </style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>委托手续</h1>
    </div>
    <div class="badge">本地生成</div>
  </header>
  <p class="field-note">在此页面填写的信息用于本机生成文件。使用模型整理材料时，相应内容仍会进入模型处理。</p>

  <form id="caseForm">
    <section>
      <h2>委托程序</h2>
      <div class="grid">
        <label>委托程序
          <select id="procedureType">
            <option value="arbitration_applicant">仲裁——申请人</option>
            <option value="arbitration_respondent">仲裁——被申请人</option>
            <option value="litigation_first_instance">诉讼——一审</option>
            <option value="litigation_second_instance">诉讼——二审</option>
            <option value="litigation_retrial">诉讼——再审</option>
            <option value="enforcement">执行程序</option>
          </select>
        </label>
        <label>代理权限
          <select id="authType"><option>特别授权</option><option>一般授权</option></select>
        </label>
      </div>
    </section>

    <section>
      <h2>生成文件</h2>
      <div class="check-grid">
        <label class="check"><input type="checkbox" name="docs" value="agreement" checked> 委托代理协议</label>
        <label class="check"><input type="checkbox" name="docs" value="authorization" checked> 授权委托书</label>
        <label class="check"><input type="checkbox" name="docs" value="certificate" checked> 身份证明</label>
        <label class="check"><input type="checkbox" name="docs" value="letter" checked> 所函</label>
      </div>
    </section>

    <section>
      <h2>当事人信息</h2>
      <p class="section-note">勾选本所客户；多名客户分别生成。</p>
      <div class="hidden">
        <label>多客户生成方式
          <select id="clientGenerationMode">
            <option value="separate">每名客户分别生成一套（推荐）</option>
            <option value="joint" disabled>共同委托文件（现有模板暂不支持）</option>
          </select>
        </label>
      </div>
      <div id="partiesContainer" class="party-list"></div>
      <div class="inline-actions"><button id="addPartyBtn" type="button" class="secondary">＋ 增加当事人</button></div>
      <div id="partySummary" class="party-summary"></div>
    </section>

    <section>
      <h2>案件信息</h2>
      <div class="grid">
        <label>案由<input id="cause" required placeholder="例如：买卖合同纠纷"></label>
        <label>案号 <span class="optional">选填</span><input id="caseNo" placeholder="例如：（2026）沪0115民初123号"></label>
        <label class="wide"><span id="forumLabel">管辖法院</span><input id="court" required placeholder="例如：上海市浦东新区人民法院"></label>
        <label>签署/落款日期<input id="signDate" type="date" required></label>
      </div>
    </section>

    <section>
      <h2>律师与律所</h2>
      <div class="grid">
        <label>签约律所/分所
          <select id="branch">
            <option value="beijing">北京市汉坤律师事务所（北京总所）</option>
            <option value="shanghai">北京市汉坤律师事务所上海分所</option>
            <option value="shenzhen">北京市汉坤（深圳）律师事务所</option>
            <option value="haikou">北京汉坤（海口）律师事务所</option>
            <option value="wuhan">北京市汉坤（武汉）律师事务所</option>
            <option value="hangzhou">北京汉坤（杭州）律师事务所</option>
          </select>
        </label>
        <label>律师1姓名<input id="lawyer1" required placeholder="例如：李律师"></label>
        <label>律师1电话 <span class="optional">选填</span><input id="phone1" inputmode="tel"></label>
        <label>律师1邮箱 <span class="optional">选填</span><input id="email1" type="email"></label>
        <label>律师2姓名 <span class="optional">选填</span><input id="lawyer2" placeholder="不填则仅生成一名律师"></label>
        <label>律师2电话 <span class="optional">选填</span><input id="phone2" inputmode="tel"></label>
        <label>律所地址<input id="firmAddress" readonly></label>
        <label class="wide">统一案件联络人 <span class="optional">选填</span><input id="clientContact" placeholder="填写后覆盖各客户联络人"></label>
        <label>统一联络电话 <span class="optional">选填</span><input id="clientPhone" inputmode="tel"></label>
        <label>统一联络邮箱 <span class="optional">选填</span><input id="clientEmail" type="email"></label>
      </div>
    </section>

    <section>
      <h2>律师收费</h2>
      <div class="grid">
        <label>收费方式
          <select id="feeMode">
            <option value="fixed">固定收费</option>
            <option value="hybrid">前期固定律师费 + 后期风险代理律师费</option>
            <option value="hourly">按实际工作小时计费 + 封顶</option>
          </select>
        </label>
        <label id="feeAmountLabel">律师费总额（元）<input id="feeAmount" inputmode="decimal" required placeholder="例如：50000"></label>
        <label id="feeRateField" class="hidden">后期风险代理比例（%）<input id="feeRate" inputmode="decimal" placeholder="例如：6"></label>
        <label id="feeCapField" class="hidden">律师费封顶金额（元）<input id="feeCap" inputmode="decimal" placeholder="不填则使用上方金额"></label>
        <label>税费口径
          <select id="taxMode"><option value="included">含税（6%增值税）</option><option value="excluded">不含税，另加6%增值税</option></select>
        </label>
        <label>差旅及第三方费用
          <select id="expenseMode"><option value="client">由甲方另行承担</option><option value="firm">由乙方承担</option></select>
        </label>
      </div>
    </section>

    <section>
      <h2>协议补充项</h2>
      <div class="grid">
        <label>协议争议解决机构<input id="arbInstitution" value="北京仲裁委员会"></label>
        <label>仲裁地<input id="arbSeat" value="北京"></label>
        <label class="check wide"><input id="conflictWaiver" type="checkbox"> 加入利益冲突豁免特别约定</label>
        <label id="conflictClientField" class="wide hidden">已知存在潜在冲突的主体<input id="conflictClient"></label>
      </div>
    </section>

    <div class="actions">
      <button id="generateBtn" type="submit">生成选中的 Word 文件</button>
      <button id="downloadZipBtn" type="button" class="secondary hidden">下载全部文件 ZIP</button>
      <div id="status" role="status" aria-live="polite"></div>
    </div>
  </form>

  <section id="resultsSection" class="hidden">
    <h2>本次生成结果</h2>
    <div id="results" class="results"></div>
  </section>
</main>

    removeEmptyParagraphs(doc);
  }

  function mutateCertificate(doc,d){
    stripInternalNotes(doc);
    if (d.partyType === "execPartner") {
      setDirect(doc,function(t){return t.indexOf("执行事务合伙人证明书") === 0;},d.certificateTitle);
      setDirect(doc,function(t){return t.indexOf("兹证明") === 0;},"兹证明，" + d.repName + "系我单位的执行事务合伙人。");
      setDirect(doc,function(t){return t.indexOf("【委托人名称】") === 0;},d.client + "（盖章）");
      setDirect(doc,function(t){return t.indexOf("附：") === 0;},"附：" + d.repName + "身份证明文件复印件");
    } else if (d.partyType === "delegate") {
      setDirect(doc,function(t){return t.indexOf("执行事务合伙人委派代表身份证明") === 0;},d.certificateTitle);
      setDirect(doc,function(t){return t.indexOf("兹证明") === 0;},"兹证明" + d.repName + "是我单位执行事务合伙人" + d.execPartnerName + "之委派代表。");
      setDirect(doc,function(t){return t.indexOf("【委托人名称】") === 0;},d.client + "（盖章）");
      setDirect(doc,function(t){return t.indexOf("附：") === 0;},"附：委派代表身份证/护照复印件");
    } else if (d.partyType === "自然人") {
      setDirect(doc,function(t){return t.indexOf("法定代表人/负责人身份证明") === 0;},d.certificateTitle);
      setDirect(doc,function(t){return t.indexOf("兹证明") === 0;},"兹证明" + d.client + "，身份证号：" + d.clientIdNo + "，住址：" + d.clientAddress + "。");
      setDirect(doc,function(t){return t.indexOf("【委托人名称】") === 0;},d.client + "（签字）");
      setDirect(doc,function(t){return t.indexOf("附：") === 0;},"附：身份证复印件");
    } else {
      setDirect(doc,function(t){return t.indexOf("法定代表人/负责人身份证明") === 0;},d.certificateTitle);
      var unitWord = d.partyType === "法人" ? "公司" : "单位";
      setDirect(doc,function(t){return t.indexOf("兹证明") === 0;},"兹证明" + d.repName + "在我" + unitWord + "担任" + (d.repPosition || d.repTitle) + "，是我" + unitWord + "的" + d.repTitle + "。");
      setDirect(doc,function(t){return t.indexOf("【委托人名称】") === 0;},d.client + "（盖章）");
      setDirect(doc,function(t){return t.indexOf("附：") === 0;},"附：" + d.repTitle + "身份证复印件");
    }
    fillDatePara(directFind(bodyParas(doc),function(t){return t.indexOf("年") === 0 && t.indexOf("月") >= 0;},0),d.signDate);
    stripPlaceholders(doc);
    clearHighlights(doc);
    removeEmptyParagraphs(doc);
  }

  function mutateLetter(doc,d,profile){
    stripInternalNotes(doc);
    setDirect(doc,function(t){return t.indexOf("【") === 0 && (t.indexOf("人民法院") >= 0 || t.indexOf("仲裁委全称") >= 0);},d.court + "：");
    setDirect(doc,function(t){return t.indexOf("就") === 0;},
      "就" + d.plaintiff + "与" + d.defendant + "之间的" + caseCause(d) + "案件" + (d.caseNo ? "[案号：" + d.caseNo + "]" : "") + "，本所" + lawyerLabel(d.lawyer1) + (d.lawyer2 ? "、" + lawyerLabel(d.lawyer2) : "") + "受" + d.client + "的委托及本所指派，作为" + d.client + "在本案中的代理人，参加本案的" + procedureLabel(d) + "法律程序。");
    setDirect(doc,function(t){return t.indexOf("\t  北京市汉坤律师事务所") >= 0 || t.indexOf("北京市汉坤律师事务所") >= 0;},d.firmName);
    fillDatePara(directFind(bodyParas(doc),function(t){return t.indexOf("年") === 0 && t.indexOf("月") >= 0;},0),d.signDate);
    stripPlaceholders(doc);
    clearHighlights(doc);
    removeEmptyParagraphs(doc);
  }

  async function makeDoc(templateKey,d,filename,docType,profile){
    var zip = await JSZip.loadAsync(TEMPLATES[templateKey],{base64:true});
    var xml = await zip.file("word/document.xml").async("string");
    var parsed = new DOMParser().parseFromString(xml,"application/xml");
    if (parsed.getElementsByTagName("parsererror").length) throw new Error("模板 XML 解析失败：" + templateKey);
    if (docType === "agreement") mutateAgreement(parsed,d,profile);
    else if (docType === "authorization") mutateAuthorization(parsed,d,profile);
    else if (docType === "letter") mutateLetter(parsed,d,profile);
    else mutateCertificate(parsed,d);
    polishDocumentFlow(parsed,docType);
    var finalText = allParas(parsed).map(pText).join("\n");
    if (!finalText.includes(d.client)) throw new Error(filename + "：未写入委托人名称");
    if ((docType === "agreement" || docType === "authorization" || docType === "letter") && !finalText.includes(d.opponent)) throw new Error(filename + "：未写入相对方主体");
    if ((docType === "authorization" || docType === "letter") && !finalText.includes(d.lawyer1)) throw new Error(filename + "：未写入承办律师");
    if (docType === "letter" && !finalText.includes(d.court)) throw new Error(filename + "：未写入法院或仲裁机构");
    if (/内部注|注意事项|填入公司名称|若签约方为/.test(finalText)) throw new Error(filename + "：仍有模板内部标记未清理");
    if (docType === "authorization" && !finalText.includes("代理权限为" + d.authType)) throw new Error(filename + "：授权类型未正确写入");
    if (docType === "agreement" && !d.caseNo && finalText.indexOf("案号：无") >= 0) throw new Error(filename + "：空案号处理错误");
    zip.file("word/document.xml",new XMLSerializer().serializeToString(parsed));
    var blob = await zip.generateAsync({type:"blob",compression:"STORE"});
    return {name:filename,blob:blob,client:d.client,docType:docType};
  }
  function fileNames(d){
    var base = escapeFilenameBase(d);
    var program = safeFilePart(d.programLabel);
    return {
      agreement:"委托代理协议_" + program + "_" + base + ".docx",
      authorization:"授权委托书_" + program + "_" + base + ".docx",
      certificate:d.certificateTitle + "_" + base + ".docx",
      letter:"律师事务所函_" + program + "_" + base + ".docx"
    };
  }
  async function buildFiles(base){
    var jobs = [];
    base.clients.forEach(function(client){
      var d = dataForClient(base,client);
      var names = fileNames(d);
      var agreement = AGREEMENT_TEMPLATE_MAP[d.procedureType];
      var authorization = AUTHORIZATION_TEMPLATE_MAP[d.procedureType];
      var letter = LETTER_TEMPLATE_MAP[d.procedureType];
      if (d.docs.indexOf("agreement") >= 0) jobs.push(makeDoc(agreement.template,d,names.agreement,"agreement",agreement.profile));
      if (d.docs.indexOf("authorization") >= 0) jobs.push(makeDoc(authorization.template,d,names.authorization,"authorization",authorization.profile));
      if (d.docs.indexOf("certificate") >= 0 && d.certificateAllowed) jobs.push(makeDoc(d.certificateTemplate,d,names.certificate,"certificate",""));
      if (d.docs.indexOf("letter") >= 0) jobs.push(makeDoc(letter.template,d,names.letter,"letter",letter.profile));
    });
    return Promise.all(jobs);
  }
  function caseZipBase(base){
    var clients = joinedNames(base.clients) || "委托人";
    var clientSides = new Set(base.clients.map(function(p){return p.side;}));
    var others = base.parties.filter(function(p){return !p.isClient && !clientSides.has(p.side);});
    return safeFilePart(clients + "VS" + (joinedNames(others) || "对方"));
  }
  async function zipFiles(files){
    var zip = new JSZip();
    files.forEach(function(f){zip.file(f.name,f.blob,{binary:true});});
    return zip.generateAsync({type:"blob",compression:"STORE"});
  }
  function downloadBlob(blob,name){
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function(){URL.revokeObjectURL(url);},60000);
  }
  function renderResults(files,d){
    var section = $("resultsSection");
    var box = $("results");
    box.replaceChildren();
    files.forEach(function(f){
      var card = document.createElement("div");
      card.className = "result-card";
      var info = document.createElement("div");
      var name = document.createElement("div");
      name.className = "name";
      name.textContent = f.name;
      var meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = "DOCX · " + Math.round(f.blob.size/1024) + " KB";
      info.append(name,meta);
      var btn = document.createElement("button");
      btn.type = "button";
      btn.textContent = "下载";
      btn.addEventListener("click",function(){downloadBlob(f.blob,f.name);});
      card.append(info,btn);
      box.append(card);
    });
    section.classList.remove("hidden");
    section.scrollIntoView({behavior:"smooth",block:"start"});
  }
  form.addEventListener("submit",async function(event){
    event.preventDefault();
    var data = collectData();
    var errors = validateData(data);
    if (errors.length) {
      setStatus(errors.join("；"),"bad");
      return;
    }
    $("generateBtn").disabled = true;
    $("downloadZipBtn").classList.add("hidden");
    setStatus("正在根据模板生成 DOCX，请稍候…","");
    try {
      lastFiles = await buildFiles(data);
      lastZipBlob = await zipFiles(lastFiles);
      renderResults(lastFiles,data);
      $("downloadZipBtn").classList.remove("hidden");
      var skippedNaturalCertificates = data.docs.indexOf("certificate") >= 0 ? data.clients.filter(function(p){return !p.certificateAllowed;}).length : 0;
      setStatus("已生成 " + lastFiles.length + " 份文件" + (skippedNaturalCertificates ? "；另有 " + skippedNaturalCertificates + " 名自然人未生成无适用模板的身份证明" : "") + "。内容仍保留在本机。","good");
    } catch (error) {
      console.error("local_generation_failed");
      setStatus("生成失败：" + (error && error.message ? error.message : String(error)),"bad");
    } finally {
      $("generateBtn").disabled = false;
    }
  });
  $("downloadZipBtn").addEventListener("click",function(){
    if (lastZipBlob) downloadBlob(lastZipBlob,"委托手续_" + caseZipBase(collectData()) + ".zip");
  });
</script>
<script src="adapter.js"></script>
</body>
